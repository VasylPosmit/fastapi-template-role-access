[dependency-groups]
dev = [
    "prek>=0.5.3,<1.0.0",
    "typer>=0.27.2,<1.0.0",
    "zizmor>=1.30.1",
]

github-actions = [
    "smokeshow >=0.5.0",
]

[tool.uv.workspace]
members = ["backend"]

[tool.typos.files]
extend-exclude = [
    "img/",
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "backend/app/frontend/",
    "frontend/dist/",
    "frontend/public/assets/images/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
    # Alembic revision ids (random hex), e.g. 28caf424a4a6
    "\\b[0-9a-f]{12}\\b",
]

[tool.typos.default.extend-identifiers]
alls = "alls"

# Alembic migration filenames start with a random hex revision id.
[tool.typos.type.alembic]
extend-glob = ["[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]_*.py"]
check-filename = false
